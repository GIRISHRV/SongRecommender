<!DOCTYPE html>
<html lang="en" class="bg-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneSearch Beta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/color.css">
</head>
<body>

        <nav class="navbar navbar-dark border-bottom border-3 bg-success ">
            <a class="navbar-brand px-4" href="#"><h3>TuneSearch Beta</h3></a>
        </nav>

        <div class="bg-dark text-light text-center py-5 container-fluid content d-flex align-items-stretch">
            <div class="row flex-grow-1 w-100 gy-2">
                <div class="col d-flex flex-column">
                    <div class="upload-container  rounded p-4 h-100">
                        <h1 >Enter Spotify Playlist Link</h1>
                        <input type="text" class="playlist-link form-control mb-3" placeholder="https://open.spotify.com/playlist/{playlist_id}" aria-label="Enter playlist link">
                        <button type="button" class="recommend-button btn btn-success">Get Recommendations</button>
                    </div>
                </div>
                <div class="col d-flex flex-column" style="flex: 2;">
                    <div class="recommendations-container rounded p-4 h-100">
                        <h1>Upload a text file with list of "Artist - Song" or give a Spotify Public Playlist URL to get recommendations of similar songs</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer bg-success text-light border-top border-4 py-1 text-center">
            <h3>Work In Progress</h3>
        </div>
        
        <div class="spinner spinner-border text-success d-none" role="status">
            <span class="sr-only"></span>
        </div>
    <script src="static/main.js"></script>
</body>
</html>
