<!DOCTYPE html>
<html lang="en" class="bg-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Spotify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> 
    <link rel="stylesheet" href="static/owl.carousel.min.css">
    <link rel="stylesheet" href="static/owl.theme.default.min.css">
    <link rel="stylesheet" href="static/customcolor.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <style>
        body, html {
            font-family: 'Poppins', 'Montserrat', sans-serif;
        }
        .btn-custom-width {
            width: auto;
            max-width: 300px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-dark">
    <nav class="navbar navbar-dark border-bottom border-3 bg-success">
        <a class="navbar-brand px-4" href="#"><h3>TuneSearch Beta</h3></a>
    </nav>

    <div class="container text-center flex-grow-1 d-flex flex-column justify-content-center text-light">
        <h1 class="mb-4">Connect your Account</h1>
        <button id="login-button" class="btn btn-success btn-lg btn-custom-width">Login with Spotify</button>
    </div>

    <footer class="bg-success text-light border-top border-4 py-1 text-center mt-auto">
        <h3>Work In Progress</h3>
    </footer>

    <script>
        document.getElementById('login-button').addEventListener('click', () => {
            window.location.href = '/login';
        });
    </script>
</body>
</html>
